experiences:
  - role: Principal Software Developer
    time: May/2025 - Present
    company: Blue Goji (Startup)
    details: |
      Lead of the Platform team for the migration of GojiPlay from .NET Framework 4.7 and WPF to .NET 9 and Avalonia UI as a cross-platform application.
        - Created architecture for the new application, including logging, dependency injection, and configuration.
        - Added support for themes, and localization for different languages.
        - Use AI coding assistants to accelerate development and to increase automated test coverage on new features.

      Implemented the new application launcher used on Linux to start GojiPlay.
        - Launcher component uses the same architecture, and has a shared library with the main application.

      Helped with the maintenance of existing Linux tooling and applications using Node, TypeScript, JavaScript, and MySQL.
    technologies:
        - C#
        - Avalonia UI
        - .NET 9
        - Node
        - TypeScript
        - JavaScript
        - MySQL


  - role: Senior Software Developer
    time: April/2023 - May/2025
    company: Blue Goji (Startup)
    details: |
      Worked in the Platform team adding features in C# and WPF for the game platform (Desktop application) used in different bikes and treadmills.
        - Added a built-in keyboard that provides a better experience for end users.
        - Updated the custom shell launcher, used to open the game platform, to show status messages and errors.
        - Added logic to upload metrics, logs, and bikes information to the backend server.
        - Added the "Bike Wizard" feature to help users configure the bike and treadmill for the first time.
        - Added ability to let users login by scanning a QR code with their phone.
        - Added support for dark and light themes.
    technologies:
      - C#
      - WPF
      - MVVM
      - json
      - Ruby


  - role: Senior Software Engineer
    time: May/2022 - March/2023
    company: Google
    details: |
      Worked on the Messages application for Wear OS, which lets users send and receive messages from their smart watch while keeping data in sync with the phone application.
        - I helped with the features for the release of the Google Pixel Watch (October 2022).
        - Worked with UX team to fix localization issues that required changes in some strings and updates in the layout of the UI.
        - Added performance metrics and created dashboards to help monitor the metrics.
        - Added metrics to measure usage for messages sent by external applications.
    technologies:
      - Java
      - Kotlin
      - Android
      - Espresso
      - Dagger
      - SQLite
      - Lua


  - role: Software Tools Developer
    time: January/2020 - May/2022
    company: Cirrus Logic
    details: |
      Worked with the Core team adding features in the company application, the register map application, and the internal SDK library used by developers to create UI components.
        - Company major product
          - Added features with a 100% test coverage.
          - Ability to open pdf files in a named destination to provide help based on the context of the user workflow.
          - Feature to execute python scripts from within the application.
          - Flag to open specified documents automatically when the application was loaded.
        - Internal SDK library
          - Added new features to the internal SDK framework with unit tests, and snapshot tests for the UI changes.
          - Wrote backward compatibility tests for changes in the public API so that clients can update their dependencies without API breaking issues.
        - Register map application
          - Redesigned the layout and improved the performance by 25% (measured in FPS).
          - Updated the shutdown sequence reducing the time to close the application from 15 to 2 seconds for the biggest chip (100K registers).
          - Fixed several memory leaks and added automated test for memory leaks, improving the stability of the application
          - Updated the behavior of the search feature of the app to make it more responsive.
    technologies:
      - Java
      - JavaFx
      - JUnit
      - Python
      - Gradle
      - Gerrit


  - role: Senior Software Engineer
    subrole:
    time: February/2018 - January/2020
    company: National Instruments
    details: |
        - Developer of the InstrumentStudio application, it allows users to configure and acquire data from hardware instruments with an easy to use UX.
        - Designed the integration between InstrumentStudio and TestStand to let users export the hardware configuration to execute steps in their automation process for testing.
        - Implemented the support to host applications written in LabVIEW and C# within InstrumentStudio, persisting their configuration alongside the application project when it was saved.
          - The feature used Windows api calls to communicate between InstrumentStudio and the hosted applications.
        - Performed code reviews and design reviews to help maintain the quality of the application.
        - Mentored junior engineers to help them improve their design and development skills.
    technologies:
      - C#
      - WPF
      - LabVIEW
      - Python
      - Makefile


  - role: Staff Software Engineer
    subrole: Mid-level
    time: August/2014 - February/2018
    company: National Instruments
    details: |
      - Worked on several releases of the VirtualBench application for Windows and iOS with cross-platform development in C#. UI for Windows was written in WPF.
      - Implemented the code-generation of the VirtualBench API for LabVIEW NxG in python using the same definition file used for the generation of the API for C and C#.
    technologies:
      - C#
      - WPF
      - Cross-platform development
      - LabVIEW
      - Python
      - Makefile


  - role: Software Engineer
    subrole:
    time: May/2011 - August/2014
    company: National Instruments
    details: |
        - Worked in the version 1.0 of VirtualBench for windows which was written in C#.
        - Worked in LabVIEW NxG (company major product), adding features to interact with myDAQ hardware.
        - Implemented the Device Pinouts and the Data Display applications for Android using Java.
    technologies:
      - C#
      - WPF
      - LabVIEW
      - Python
      - Ruby
      - Makefile
      - Java


  - role: Software Development Engineer
    subrole: Intern
    time: May/2010 - August/2010
    company: Microsoft
    details: |
        Worked in the Microsoft Division Business of the Office team.
        - Developed an internal tool including planning, development, testing and deployment creating an installer as an extension for VisualStudio.
        - The project was done with C# and the Microsoft SDK
    technologies:
      - C#
      - WPF
      - Microsoft SDK

