summary: |
  <p class="summary-lead mb-3">I work as a Principal Software Developer across the stack: customer-facing applications, internal platforms, and engineering tooling.</p>
  <p class="mb-3">I was on Google’s Wear OS Messages team (Kotlin/Java), including the Pixel Watch launch. Before that I spent a lot of time on semiconductor tooling and automated test software.</p>
  <p class="mb-0">Day to day I lean on architecture, automated tests, and performance work tied to real metrics. I also put meaningful time into mentoring through design discussions and code reviews, so quality doesn’t slip as products and teams grow.</p>
summary_stack: "Primary strengths: C#, .NET, Avalonia and WPF/MVVM, Android (Kotlin/Java), Python, Node, and TypeScript. Most of my recent work is cross-platform desktop development for Windows, macOS, and Linux, plus tools, services, and developer productivity."

